<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganti Password · Buku Induk JosBook</title>
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/cetak.css">
</head>
<body>
<div class="app"><aside class="sb" id="sidebar"></aside><div class="mn"><header class="tb" id="topbar"></header>
<main id="konten">
  <h2>Ganti Password</h2>
  <div class="note" id="info" hidden>Demi keamanan, Anda wajib mengganti password awal sebelum melanjutkan.</div>
  <div class="card" id="isi" style="max-width:420px">
    <form id="form-password">
      <div class="fl" style="grid-template-columns:1fr">
        <div><label>Password lama</label><input type="password" name="password_lama" required></div>
        <div><label>Password baru</label><input type="password" name="password" required></div>
        <div><label>Ulangi password baru</label><input type="password" name="password_confirmation" required></div>
      </div>
      <div class="bar" style="margin-top:12px"><button class="btn a" type="submit">Simpan</button></div>
    </form>
  </div>
</main></div></div>
<script src="../../assets/js/core/config.js"></script>
<script src="../../assets/js/core/auth.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/guard.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/modules/ganti-password.js"></script>
</body>
</html>
